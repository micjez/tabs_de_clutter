<!DOCTYPE html>
<html>
    <head>
        <style>
            body {
            font-family: system-ui, sans-serif;
            padding: 20px;
            max-width: 640px;
            }
            input, select, textarea {
            width: 100%;
            padding: 6px;
            margin-top: 4px;
            margin-bottom: 12px;
            }
            button {
            padding: 8px 12px;
            }
            .hint {
            font-size: 12px;
            color: #666;
            }
            hr {
            margin: 20px 0;
            }
        </style>
    </head>
    <body>
        <h2>Bookmark Folder Preferences</h2>

        <label>Folder Name Template</label>
        <input id="template" />
        <div class="hint">
            Variables: {YYYY} {MM} {DD} {HH} {mm}
        </div>

        <label>When folder exists</label>
        <select id="behavior">
            <option value="increment">Increment name by 1 </option>
            <option value="append">Append to existing folder</option>
        </select>

        <hr />

        <h2>AI Note Preferences</h2>

        <label>OpenAI API Key</label>
        <input id="openaiApiKey" type="password" autocomplete="off" placeholder="sk-..." />

        <label>Model</label>
        <input id="openaiModel" placeholder="gpt-4.1-mini" />

        <label>Prompt Override (optional)</label>
        <textarea id="summaryPromptOverride" rows="5" placeholder="Optional custom prompt for summary output"></textarea>

        <label>Max Input Characters</label>
        <input id="maxInputChars" type="number" min="1000" step="500" />
        <div class="hint">
            The extension sends extracted page text to OpenAI for summarization.
        </div>

        <button id="save">Save</button>

        <script type="module" src="options.js"></script>

    </body>
</html>
