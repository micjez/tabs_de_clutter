name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run tests
        run: npm test
        
      - name: Build extension
        run: npm run build:release
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            tabs-de-clutter-chrome-v*.zip
            tabs-de-clutter-firefox-v*.xpi
          generate_release_notes: true
          draft: false
          prerelease: false
